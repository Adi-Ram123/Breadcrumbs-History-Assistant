[project]
name = "breadcrumbs-backend"
version = "0.1.0"
description = "Breadcrumbs local backend: ingest, SQLite + sqlite-vec, executor, verifier"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "sentence-transformers>=6.2.0",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
