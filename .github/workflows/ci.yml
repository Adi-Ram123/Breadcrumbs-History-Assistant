name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run pytest -v
      - name: Fixtures unchanged outside reviewed commits
        run: uv run python scripts/check_fixture_hashes.py
      - name: Eval harness runs
        run: uv run python eval/run.py

  extension:
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-packages --locked
      - uses: oven-sh/setup-bun@v2
      - name: Export OpenAPI schema
        run: uv run python backend/scripts/export_openapi.py
      - name: Install and regenerate API client
        working-directory: extension
        run: |
          bun install --frozen-lockfile
          bun run gen:api
      - name: OpenAPI and generated client are committed and in sync
        run: git diff --exit-code backend/openapi.json extension/lib/api/schema.d.ts
      - name: Typecheck, test, build
        working-directory: extension
        run: |
          bun run typecheck
          bun run test
          bun run build
