[project]
name = "breadcrumbs-ml"
version = "0.1.0"
description = "Breadcrumbs model code (Aditya): retriever, parsers, LLM client, answer writer"
requires-python = ">=3.12"
dependencies = ["breadcrumbs-backend"]

[tool.uv.sources]
breadcrumbs-backend = { workspace = true }

[dependency-groups]
# Training-only deps: uv sync --all-packages --group train
train = ["transformers", "datasets", "seqeval", "accelerate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breadcrumbs_ml"]
